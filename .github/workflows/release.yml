name: Release

# 推送 v* 标签时：
#   1. 依据 cliff.toml 生成 Changelog 并创建 GitHub Release
#   2. 四平台构建 Tauri 安装包(dmg / AppImage+deb+rpm / nsis)并附加到该 Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # 生成 Changelog 并创建 GitHub Release
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 依据 cliff.toml 生成本次发布的 Changelog
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          # 预发布标签（含 "-"，如 v1.0.0-rc.1）尚未入 cliff 的 tag 序列，用 --unreleased 生成
          args: ${{ contains(github.ref_name, '-') && format('--unreleased --tag {0}', github.ref_name) || '--latest' }} --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

      # 创建 GitHub Release，正文取自上一步生成的 Changelog
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body_path: CHANGES.md
          token: ${{ secrets.GITHUB_TOKEN }}
          # SemVer 预发布版本（含 "-"）自动标记为 Pre-release
          prerelease: ${{ contains(github.ref_name, '-') }}

  # 构建四平台 Tauri 安装包并附加到 Release
  build:
    name: Build ${{ matrix.name }}
    needs: [changelog]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-latest
            args: --target aarch64-apple-darwin
            bundles: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macos-x86_64
            os: macos-latest
            args: --target x86_64-apple-darwin
            bundles: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - name: linux-x86_64
            os: ubuntu-22.04
            args: ""
            bundles: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
          - name: windows-x86_64
            os: windows-latest
            # MSI 的 ProductVersion 只接受纯数字预发布段(≤65535), 含 rc 之类字母段的
            # 版本会被 WiX 拒绝——预发布标签(含 "-")只出 NSIS, 稳定版标签 nsis+msi 都出;
            # 下方上传步骤对未匹配的 msi 通配符只告警不失败(fail_on_unmatched_files 默认 false)
            args: ${{ contains(github.ref_name, '-') && '--bundles nsis' || '' }}
            bundles: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install system dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Frontend install
        run: pnpm install --frozen-lockfile

      - name: Tauri build
        run: pnpm tauri build ${{ matrix.args }}

      # 安装包附加到 changelog job 创建的 Release
      - name: Upload bundles
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.bundles }}
          token: ${{ secrets.GITHUB_TOKEN }}
