# cargo-deny 配置: 依赖审计(CI 强制)
[advisories]
version = 2
yanked = "deny"
# 以下全部为 unmaintained 类通告(非漏洞), 均来自 Tauri 官方依赖树, 应用侧无法替换:
# - gtk3-rs 家族: Tauri 2 在 Linux 上仍基于 GTK3/webkit2gtk-4.1, 上游迁移 GTK4 前所有 Tauri 应用都命中
# - proc-macro-error / unic-*: tauri 的传递依赖
ignore = [
    "RUSTSEC-2024-0370", # proc-macro-error unmaintained
    "RUSTSEC-2024-0411", # gtk3-rs 家族(下同)
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    "RUSTSEC-2025-0075", # unic-* 家族(下同)
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
