# Tauri 配置(2026-07-12 由 tauri.conf.json 迁移为 TOML):
# 键名按官方惯例 kebab-case, 解析依赖 tauri / tauri-build 的 config-toml feature。
# 字段参考: https://tauri.app/reference/config/

product-name = "PINCER"
version = "../package.json"
identifier = "io.github.zlx2019.gitpincer"

[build]
before-dev-command = "pnpm dev"
dev-url = "http://localhost:1420"
before-build-command = "pnpm build"
frontend-dist = "../build"
# 打包时按 capabilities 清理未用到的插件命令(仅插件, 不涉及应用自身命令)
remove-unused-commands = true

# 防启动白闪: visible=false 起窗 + 原生暗底色/暗主题, 前端首帧后再 show()
# scroll-bar-style: 仅 Windows(WebView2 ≥125) 生效的 Fluent 悬浮滚动条, 其余平台无操作
# background-throttling: 仅 WebKit(macOS 14+) 生效; 默认策略下驻留托盘约 5 分钟后
# 页面被挂起, 长操作的终端输出会断流, disabled 保持隐藏期间 JS 照常运行
[[app.windows]]
label = "main"
title = "PINCER"
width = 420
height = 640
min-width = 380
min-height = 520
center = true
visible = false
accept-first-mouse = true
background-color = "#1e1f22"
theme = "Dark"
scroll-bar-style = "fluentOverlay"
background-throttling = "disabled"


[app.security]
csp = "default-src 'self'; connect-src 'self' ipc: http://ipc.localhost; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'"

[bundle]
active = true
targets = "all"
category = "DeveloperTool"
publisher = "Zero"
copyright = "Copyright © 2026 Zero"
homepage = "https://github.com/zlx2019/git-pincer-desktop"
license = "MIT"
license-file = "../LICENSE"
short-description = "IDEA-style Git conflict resolver"
long-description = "PINCER — resolve Git merge conflicts in an IDEA-style three-pane editor. Launch pull / merge / rebase / cherry-pick / revert and take over conflicts the moment they appear."
icon = [
  "icons/32x32.png",
  "icons/128x128.png",
  "icons/128x128@2x.png",
  "icons/icon.icns",
  "icons/icon.ico",
]

# Tauri 2 支持下限即 Catalina, 显式声明作为支持承诺写进 Info.plist
[bundle.macos]
minimum-system-version = "10.15"

# 安装器界面跟应用一样中英双语, 首次安装弹语言选择
[bundle.windows.nsis]
languages = ["SimpChinese", "English"]
display-language-selector = true

[bundle.windows.wix]
language = ["zh-CN", "en-US"]

# Debian 软件分区: vcs = 版本控制工具类
[bundle.linux.deb]
section = "vcs"
