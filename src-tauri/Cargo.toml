[package]
name = "git-pincer-desktop"
version = "0.1.0-rc.1"
description = "IDEA-style three-pane Git conflict resolver — desktop app for git-pincer"
authors = ["Zero <zero9501@outlook.com>"]
edition = "2024"
rust-version = "1.96.0"
license = "MIT"
readme = "../README.md"
repository = "https://github.com/zlx2019/git-pincer-desktop"
keywords = ["git", "merge", "conflict", "diff", "tauri"]
categories = ["development-tools", "gui", "text-editors"]

[lib]
name = "git_pincer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["config-toml"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "config-toml", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
similar = "3.1"

### Lint rules
[lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"

### Development profile
[profile.dev.package."*"]
opt-level = 2

### Production packaging configuration
[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
