[package]
name = "git-pincer-desktop"
version = "0.1.0"
description = "IDEA-style three-pane Git conflict resolver — desktop app for git-pincer"
authors = ["Zero <zero9501@outlook.com>"]
edition = "2024"
rust-version = "1.96.0"
license = "MIT"

[lib]
name = "git_pincer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# config-toml: 配置文件用 Tauri.toml(TOML 格式), tauri 与 tauri-build 需同时启用
tauri-build = { version = "2", features = ["config-toml"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "config-toml"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
similar = "3.1"

### Lint rules
[lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"

### Development profile
# 依赖以 O2 编译(首次编译变慢, 但有缓存): similar 的 Myers 热循环在 dev 下
# 走优化码路, `pnpm tauri dev` 的 diff/合并体验与 release 一致, 500ms deadline
# 不再因 O0 依赖被大文件轻易击穿。本 crate 保持 O0, 增量编译与可调试性不受影响
[profile.dev.package."*"]
opt-level = 2

### Production packaging configuration
[profile.release]
lto = true            # 完整链接时优化(跨 crate 内联), 优于 thin; 仅发布构建付编译时间
codegen-units = 1     # 单编译单元，优化更充分（编译更慢）
opt-level = 3         # 速度优先(diff 引擎受益); 体积由 strip + lto 兜底
strip = true          # 剥离调试符号，减小二进制体积
panic = "abort"
